<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,sans-serif;background:#fff}
.controls{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px 0 0;flex-wrap:wrap}
.toggle-group{display:flex;background:#f3f4f6;border-radius:8px;padding:3px}
.toggle-btn{padding:8px 16px;border:none;background:transparent;font-family:'Roboto',sans-serif;font-size:13px;font-weight:500;color:#6B7280;cursor:pointer;border-radius:6px;transition:all .2s}
.toggle-btn:hover{background:#e5e7eb}
.toggle-btn.active{background:#6B7280;color:#fff}
#chart{width:100%;height:440px}
.figcaption{text-align:center;font-weight:600;font-size:15px;color:#5A5A5A;font-family:'Roboto',-apple-system,sans-serif;padding:6px 16px 8px;line-height:1.4}
</style>
</head>
<body>
<div class="controls"><div class="toggle-group" id="toggles"></div></div>
<div id="chart"></div>
<div class="figcaption">Figure 4: Change in household income by income decile</div>
<script>
const LABELS={low:'Low',central:'Central',central_youth_tilted:'Youth-tilted',high:'High'};
fetch('./data/deciles.csv')
.then(r=>r.text())
.then(csv=>{
  const rows=csv.trim().split('\n').slice(1).map(l=>{const c=l.split(',');return{scenario:c[0],decile:c[1],change:parseFloat(c[2])}});
  const scenarios=[...new Set(rows.map(r=>r.scenario))];
  let sel='central';
  const tg=document.getElementById('toggles');
  scenarios.forEach(s=>{
    const b=document.createElement('button');
    b.className='toggle-btn'+(s===sel?' active':'');
    b.textContent=LABELS[s]||s;
    b.onclick=()=>{sel=s;render();document.querySelectorAll('.toggle-btn').forEach(x=>x.classList.toggle('active',x===b))};
    tg.appendChild(b);
  });
  function render(){
    const d=rows.filter(r=>r.scenario===sel).sort((a,b)=>+a.decile-+b.decile);
    Plotly.newPlot('chart',[{
      x:d.map(r=>r.decile),
      y:d.map(r=>r.change),
      type:'bar',
      marker:{color:d.map(r=>r.change>=0?'#319795':'#616161')},
      hovertemplate:'Decile %{x}: £%{y:,.0f}<extra></extra>'
    }],{
      xaxis:{title:'Equivalised household income decile',dtick:1},
      yaxis:{title:'Average annual household income change (£)',tickformat:',.0f'},
      margin:{t:20,r:20,b:60,l:80},
      font:{family:'Roboto, sans-serif'},
      plot_bgcolor:'#fff',paper_bgcolor:'#fff'
    },{displayModeBar:false,responsive:true});
  }
  render();
});
</script>
</body>
</html>
