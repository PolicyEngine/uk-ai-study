<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333;font-size:18px;line-height:1.6;padding:0}
#content>:first-child{margin-top:0}
#content>:last-child{margin-bottom:0}
p{margin:16px 0}
a{color:#2C7A7B;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="content"></div>
<script>
fetch('./data/scenarios.csv')
.then(r=>r.text())
.then(csv=>{
  const lines=csv.trim().split('\n').slice(1);
  const rows={};
  lines.forEach(l=>{
    const c=l.match(/(".*?"|[^,]+)/g);
    rows[c[0]]={displaced:parseInt(c[4]),cost:parseFloat(c[5]),bhc:parseFloat(c[6]),base:parseFloat(c[8]),shocked:parseFloat(c[9])};
  });
  const c=rows['central'];
  document.getElementById('content').innerHTML=
    `<p>These results are scenario analysis, not prediction: they trace what would follow if labour-market shocks of a given size and incidence materialised, under tax-benefit rules as legislated. Three findings organise the analysis. First, measured inequality rises in every displacement calibration we examine — all 66 grid cells and all five incidence families — because zero earnings for selected workers, partial tax-benefit replacement, wage gains for workers who remain in employment and the capital uplift jointly widen post-shock income gaps. Second, who bears the shock materially changes its simulated cost: the same central shock costs the Exchequer roughly a quarter more under exposure-proportional incidence than under uniform incidence, and more still under an author-designed top-loaded stress test. Third, the adjustment margin matters as much as the shock itself — moving the same earnings loss from job losses to wage cuts nearly eliminates the poverty effect and flips the sign of the inequality change. The tax-benefit system absorbs roughly a third of the market-income loss in the decile with the largest loss, but that cushioning appears as a net fiscal cost of £${c.cost.toFixed(1)} billion a year in the central case — pointing to three areas for further analysis: occupational reallocation, entry prospects for younger workers, and the resilience of a labour-income-heavy tax base. The full paper — including the shock-size grid, Monte Carlo uncertainty, duration and take-up sensitivities, benchmarking against the Irish results, and limitations — is available <a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7174479" target="_blank" rel="noopener noreferrer">on SSRN</a>, with all code and aggregate artefacts in the <a href="https://github.com/PolicyEngine/uk-ai-study" target="_blank" rel="noopener noreferrer">uk-ai-study repository</a>.</p>`;
});
</script>
</body>
</html>
