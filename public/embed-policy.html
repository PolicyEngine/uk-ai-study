<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333;font-size:18px;line-height:1.6;padding:0}
#content>:first-child{margin-top:0}
#content>:last-child{margin-bottom:0}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:16px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #e5e7eb}
th{font-weight:600;color:#333}
tr:nth-child(even){background:#f9fafb}
.caption{font-weight:600;text-align:center;font-size:15px;color:#5A5A5A;margin:8px 0 4px}
p{margin:16px 0}
.note{font-size:14px;color:#6B7280}
</style>
</head>
<body>
<div id="content"></div>
<script>
const LABELS={
  R1:'R1: Wage insurance (50% of lost earnings, £15k cap)',
  R2:'R2: Universal Credit standard allowance +20%',
  R3:'R3: Benefit cap suspension + UC taper 55% → 45%'
};
fetch('./data/policy_mc.csv')
.then(r=>r.text())
.then(csv=>{
  const rows=csv.trim().split('\n').slice(1).map(l=>{
    const c=l.split(',');
    return{reform:c[0],cost:+c[2],costSd:+c[3],pov:+c[4],povSd:+c[5],gini:+c[6],per:+c[7]};
  });
  const r1=rows.find(r=>r.reform==='R1'), r2=rows.find(r=>r.reform==='R2'), r3=rows.find(r=>r.reform==='R3');
  const povRatio=(r1.pov/r2.pov).toFixed(1), costRatio=(r1.cost/r2.cost).toFixed(1);
  let html=`<p>Wage insurance reduces BHC poverty by about ${povRatio} times as much as the Universal Credit standard-allowance reform, at about ${costRatio} times the cost: because the exposure-proportional shock displaces workers concentrated in the upper half of the distribution, most wage-insurance pounds flow to households in the top three baseline deciles, while the UC-side instruments concentrate spending in the bottom half.</p>`;
  html+=`<table><tr><th>Reform</th><th>Annual cost (£bn)</th><th>Poverty change, BHC (pp)</th><th>Gini change (pp)</th><th>Cost per pp averted, BHC (£bn)</th></tr>`;
  rows.forEach(r=>{
    html+=`<tr><td>${LABELS[r.reform]||r.reform}</td><td>£${r.cost.toFixed(1)} ± ${r.costSd.toFixed(1)}</td><td>${r.pov.toFixed(2)} ± ${r.povSd.toFixed(2)}</td><td>${r.gini.toFixed(2)}</td><td>£${r.per.toFixed(1)}</td></tr>`;
  });
  html+=`</table>`;
  html+=`<p class="caption">Table 5: Policy reforms on top of the central shock, 2027–28 (50-draw means ± standard deviation; cost per point is mean cost over mean poverty reduction)</p>`;
  html+=`<p>Using poverty averted per pound as the sole criterion, R3 averts a percentage point of BHC poverty for £${r3.per.toFixed(1)} billion and R2 for £${r2.per.toFixed(1)} billion, against £${r1.per.toFixed(1)} billion for this wage-insurance design. Wage insurance serves different aims — earnings-loss compensation and consumption smoothing — so this is not a complete instrument ranking.</p>`;
  document.getElementById('content').innerHTML=html;
});
</script>
</body>
</html>
