<!doctype html>
<html>
<head>
<meta charset="UTF-8"/>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;overflow:hidden}
svg{display:block}
.controls{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;background:#F2F4F7;border-radius:8px;padding:3px;z-index:1000}
.toggle-btn{padding:8px 16px;border:none;background:transparent;font-family:'Roboto',sans-serif;font-size:13px;font-weight:500;color:#6B7280;cursor:pointer;border-radius:6px;transition:all .2s;white-space:nowrap}
.toggle-btn:hover{background:#E2E8F0}
.toggle-btn.active{background:#319795;color:#fff}
.tooltip{position:fixed;background:#fff;padding:10px 14px;border-radius:6px;box-shadow:0 2px 12px rgba(16,24,40,.2);pointer-events:none;opacity:0;font-size:13px;z-index:1001;max-width:240px}
.tooltip strong{display:block;margin-bottom:4px}
.legend{position:absolute;bottom:16px;right:16px;font-size:12px;color:#5A5A5A;z-index:1000;background:rgba(255,255,255,.9);padding:8px;border-radius:6px}
.legend-bar{width:140px;height:12px;border-radius:2px}
.legend-labels{display:flex;justify-content:space-between;margin-top:2px}
.zoom-controls{position:absolute;top:60px;left:10px;display:flex;flex-direction:column;gap:5px;z-index:1000}
.zoom-btn{width:32px;height:32px;border:1px solid #E2E8F0;background:#fff;border-radius:4px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(16,24,40,.1)}
.zoom-btn:hover{background:#F2F4F7}
</style>
</head>
<body>
<div class="controls" id="toggles"></div>
<div class="zoom-controls">
  <button class="zoom-btn" id="zoom-in">+</button>
  <button class="zoom-btn" id="zoom-out">−</button>
</div>
<div class="legend"><div class="legend-bar" id="legend-bar"></div><div class="legend-labels"><span id="legend-min"></span><span id="legend-max"></span></div></div>
<svg id="map"></svg>
<div class="tooltip" id="tooltip"></div>
<script>
const METRICS=[
  {key:'displaced',col:4,label:'Displaced per 1,000 workers',fmt:v=>v.toFixed(0)+' per 1,000',diverging:false},
  {key:'poverty',col:6,label:'Poverty rate change',fmt:v=>'+'+v.toFixed(1)+' pp',diverging:false},
  {key:'income',col:3,label:'Income change',fmt:v=>(v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%',diverging:true}
];
async function init(){
  const [csvText,geojson]=await Promise.all([
    fetch('./data/constituency_impacts.csv').then(r=>r.text()),
    fetch('./data/constituencies.geojson').then(r=>r.json())
  ]);
  function parseCSVLine(line){
    const cols=[];let cur='',q=false;
    for(const ch of line){
      if(ch==='"'){q=!q}
      else if(ch===','&&!q){cols.push(cur);cur=''}
      else cur+=ch;
    }
    cols.push(cur);return cols;
  }
  const data={};
  csvText.trim().split('\n').slice(1).forEach(l=>{
    const c=parseCSVLine(l);
    data[c[0]]={name:c[1],vals:METRICS.map(m=>parseFloat(c[m.col]))};
  });
  let sel=0;
  const tg=document.getElementById('toggles');
  METRICS.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='toggle-btn'+(i===sel?' active':'');
    b.textContent=m.label;
    b.onclick=()=>{sel=i;paint();document.querySelectorAll('.toggle-btn').forEach(x=>x.classList.toggle('active',x===b))};
    tg.appendChild(b);
  });
  const w=window.innerWidth,h=window.innerHeight;
  const svg=d3.select('#map').attr('width',w).attr('height',h);
  const g=svg.append('g');
  const tooltip=d3.select('#tooltip');
  const coords=geojson.features.flatMap(f=>{
    const geom=f.geometry;
    if(geom.type==='Polygon')return geom.coordinates[0];
    if(geom.type==='MultiPolygon')return geom.coordinates.flatMap(p=>p[0]);
    return [];
  });
  const xMin=d3.min(coords,d=>d[0]),xMax=d3.max(coords,d=>d[0]);
  const yMin=d3.min(coords,d=>d[1]),yMax=d3.max(coords,d=>d[1]);
  const s=Math.min((w-40)/(xMax-xMin),(h-60)/(yMax-yMin));
  const ox=(w-(xMax-xMin)*s)/2,oy=(h-(yMax-yMin)*s)/2;
  const proj=d3.geoTransform({point:function(x,y){this.stream.point((x-xMin)*s+ox,h-((y-yMin)*s+oy))}});
  const path=d3.geoPath().projection(proj);
  const getCode=f=>f.properties.c||'';
  const getName=f=>f.properties.n||'';
  const paths=g.selectAll('path').data(geojson.features).enter().append('path')
    .attr('d',path).attr('stroke','#fff').attr('stroke-width',0.3)
    .on('mouseover',function(event,d){
      const info=data[getCode(d)];
      const m=METRICS[sel];
      let html=`<strong>${getName(d)}</strong>`;
      if(info&&!isNaN(info.vals[sel])) html+=`${m.label}: <b>${m.fmt(info.vals[sel])}</b>`;
      else html+='No data';
      tooltip.html(html).style('opacity',1);
      d3.select(this).attr('stroke','#101828').attr('stroke-width',1).raise();
    })
    .on('mousemove',e=>tooltip.style('left',(e.clientX+14)+'px').style('top',(e.clientY+14)+'px'))
    .on('mouseout',function(){tooltip.style('opacity',0);d3.select(this).attr('stroke','#fff').attr('stroke-width',0.3)});
  function paint(){
    const m=METRICS[sel];
    const vals=Object.values(data).map(d=>d.vals[sel]).filter(v=>!isNaN(v));
    let scale;
    if(m.diverging){
      const ext=Math.max(Math.abs(d3.min(vals)),Math.abs(d3.max(vals)));
      scale=d3.scaleLinear().domain([-ext,0,ext]).range(['#344054','#ffffff','#319795']).clamp(true);
      document.getElementById('legend-bar').style.background='linear-gradient(to right, #344054, #ffffff, #319795)';
      document.getElementById('legend-min').textContent='−'+ext.toFixed(1)+'%';
      document.getElementById('legend-max').textContent='+'+ext.toFixed(1)+'%';
    }else{
      const lo=d3.min(vals),hi=d3.max(vals);
      scale=d3.scaleLinear().domain([lo,hi]).range(['#E6FFFA','#234E52']).clamp(true);
      document.getElementById('legend-bar').style.background='linear-gradient(to right, #E6FFFA, #234E52)';
      document.getElementById('legend-min').textContent=m.fmt(lo);
      document.getElementById('legend-max').textContent=m.fmt(hi);
    }
    paths.attr('fill',d=>{
      const info=data[getCode(d)];
      return info&&!isNaN(info.vals[sel])?scale(info.vals[sel]):'#F2F4F7';
    });
  }
  const zoom=d3.zoom().scaleExtent([1,12]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);
  document.getElementById('zoom-in').onclick=()=>svg.transition().call(zoom.scaleBy,1.5);
  document.getElementById('zoom-out').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.5);
  paint();
}
init();
</script>
</body>
</html>
